name: Publicar apresentação no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões limitadas à leitura do código e à publicação do site.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter o código principal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Obter a versão com controles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/com-controles
          path: .versions/com-controles
          persist-credentials: false
      - name: Obter a versão sem controles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/sem-controles
          path: .versions/sem-controles
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .versions/com-controles/package-lock.json
            .versions/sem-controles/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar TypeScript e gerar o site principal
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Gerar a versão com controles
        working-directory: .versions/com-controles
        run: |
          npm ci
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/com-controles/
      - name: Gerar a versão sem controles
        working-directory: .versions/sem-controles
        run: |
          npm ci
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/sem-controles/
      # Um único artefato contém as duas versões e o endereço principal.
      # Publicar uma branch isoladamente apagaria a outra versão do site.
      - name: Reunir as versões no mesmo site
        run: |
          mkdir -p dist/com-controles dist/sem-controles
          cp -R .versions/com-controles/dist/. dist/com-controles/
          cp -R .versions/sem-controles/dist/. dist/sem-controles/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
